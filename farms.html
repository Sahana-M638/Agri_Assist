<!DOCTYPE html>
<html lang="en" ng-app="agriApp">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - AgriAssist AI</title>

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            display: flex;
            background: #f4fff4;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            height: 100vh;
            background: #2e7d32;
            position: fixed;
            color: white;
        }

        .sidebar h2 {
            text-align: center;
            padding: 20px;
        }

        .sidebar a {
            display: block;
            color: white;
            padding: 15px 25px;
            text-decoration: none;
        }

        .sidebar a:hover {
            background: #1b5e20;
        }

        /* Main Content */
        .main {
            margin-left: 250px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #2e7d32;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,.1);
            max-width: 600px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        .tip {
            background: #e8f5e9;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .date {
            background: #fff8e1;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }
    </style>

</head>

<body ng-controller="FarmController">

    <!-- Sidebar -->
    <div class="sidebar">

        <h2>🌱 AgriAssist AI</h2>

        <a href="#">🏠 Dashboard</a>
        <a href="#">👤 My Profile</a>
        <a href="#">🚜 My Farms</a>
        <a href="#">➕ Add Farm</a>
        <a href="#">🌱 Fertilizer Calculator</a>
        <a href="#">🌿 Disease Detection</a>
        <a href="#">🐛 Pest Detection</a>
        <a href="#">🚪 Logout</a>

    </div>

    <!-- Main -->
    <div class="main">

        <h1>🏠 Dashboard</h1>

        <div class="card">

            <label><b>Enter Farmer Name</b></label>

            <!-- Two-Way Data Binding -->
            <input type="text"
                   ng-model="farmerName"
                   placeholder="Enter your name">

            <!-- Expression Binding -->
            <h2>👋 Welcome, {{farmerName}}</h2>

            <div class="tip">

                <h3>🌱 Today's Farming Tip</h3>

                <p>{{tips}}</p>

            </div>

            <div class="date">

                <h3>📅 Today's Date</h3>

                <p>{{today | date:'dd/MM/yyyy'}}</p>

            </div>

        </div>

    </div>

    <script>

        var app = angular.module("agriApp", []);

        /* Value Dependency */
        app.value("tips", [
            "Water crops early in the morning.",
            "Use organic fertilizers regularly.",
            "Check soil moisture before irrigation.",
            "Rotate crops every season.",
            "Remove weeds regularly for healthy crop growth."
        ]);

        /* Service Dependency */
        app.service("TipService", function (tips) {

            this.getRandomTip = function () {

                var index = Math.floor(Math.random() * tips.length);

                return tips[index];

            };

        });

        /* Controller */
        app.controller("FarmController",
            function ($scope, TipService) {

                // Data Binding Variable
                $scope.farmerName = "";

                // Farming Tip
                $scope.tips = TipService.getRandomTip();

                // Current Date
                $scope.today = new Date();

            });

    </script>

</body>

</html>
